services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed
      POSTGRES_DB: sed
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed"]
      interval: 5s
      retries: 5

  api:
    build: ./api
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sed:sed@postgres:5432/sed?sslmode=disable
      ENV: development

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080/api/v1
        VITE_SHOW_DEV_TOOLBAR: "true"
    ports: ["5173:80"]
    depends_on:
      - api

volumes:
  pgdata:
