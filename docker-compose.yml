services:
  postgres:
    image: postgres:15
    ports: ["5435:5432"]
    container_name: portal-sed-db
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed
      POSTGRES_DB: sed
    restart: always
    volumes: 
      - db_sed:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    container_name: portal-sed-api
    environment:
      DATABASE_URL: postgres://sed:sed@postgres:5432/sed?sslmode=disable
      ENV: production
      CORS_ORIGINS: https://localhost:8088
      ENABLE_DEV_LOGIN: "true"

  import:
    build: ./api
    profiles: ["import"]
    network_mode: host
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sed:sed@localhost:5435/sed?sslmode=disable
    entrypoint: ["/opt/api/import"]

  web:
    build:
      context: ./web
      args:
        VITE_SHOW_DEV_TOOLBAR: "false"
        VITE_SHOW_DEMO_USERS: "true"
    depends_on:
      - api

  proxy:
    image: nginx:stable-alpine
    ports: ["8088:443"]
    volumes:
      - ./certs:/etc/nginx/certs:ro
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api

volumes:
  db_sed:
    name: portal-sed-db-volume

configs:
  proxy_conf:
    content: |
      server {
          listen 443 ssl;
          server_name _;

          ssl_certificate     /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;

          client_max_body_size 2M;

          location /api/ {
              proxy_pass http://api:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              proxy_pass http://web:80;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }

