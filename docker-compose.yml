services:
  postgres:
    image: postgres:15
    ports: ["5435:5432"]
    container_name: portal-sed-db
    env_file: .env
    restart: always
    volumes: 
      - db_sed:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    container_name: portal-sed-api
    environment:
      ENV: production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  import:
    build: ./api
    profiles: ["import"]
    network_mode: host
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    entrypoint: ["/opt/api/import"]

  web:
    build:
      context: ./web
    security_opt:
      - seccomp=unconfined
    depends_on:
      - api

  proxy:
    image: nginx:stable-alpine
    ports: ["8088:443"]
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  db_sed:
    name: portal-sed-db-volume

