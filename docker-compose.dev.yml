services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed
      POSTGRES_DB: sed
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports: ["8080:8080"]
    volumes:
      - ./api:/app          # Mount source code for hot-reload
      - go-mod:/go/pkg/mod  # Persist module cache across rebuilds
      - go-build:/root/.cache/go-build  # Persist build cache
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sed:sed@postgres:5432/sed?sslmode=disable
      ENV: development

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  proxy:
    image: nginx:stable-alpine
    ports: ["8088:80"]
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api

volumes:
  pgdata:
  go-mod:
  go-build:
  web-node-modules:

configs:
  proxy_conf:
    content: |
      server {
          listen 80;
          server_name _;

          location /api/ {
              proxy_pass http://api:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              proxy_pass http://web:5173;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }
