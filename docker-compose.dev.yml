services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: sed
      POSTGRES_DB: sed
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports: ["8080:8080"]
    volumes:
      - ./api:/app          # Mount source code for hot-reload
      - go-mod:/go/pkg/mod  # Persist module cache across rebuilds
      - go-build:/root/.cache/go-build  # Persist build cache
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sed:sed@postgres:5432/sed?sslmode=disable
      ENV: development

volumes:
  pgdata:
  go-mod:
  go-build:
