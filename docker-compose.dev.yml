services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      ENV: development
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  import:
    build: ./api
    profiles: ["import"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/opt/api/import"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

  proxy:
    image: nginx:stable-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  go-mod:
  go-build:
  web-node-modules:
