openapi: 3.1.0
info:
  title: SED Auth API
  description: Authentication and session management API for the SED evaluation platform.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1 base path
paths:
  /auth/sso-login:
    get:
      operationId: ssoLogin
      summary: Redirect to Keycloak SSO
      description: >
        Redirects the browser to the Keycloak authorization endpoint.
        Sets an httpOnly sso_state cookie for CSRF protection.
      responses:
        "302":
          description: Redirect to Keycloak login

  /auth/sso-step-up:
    get:
      operationId: ssoStepUp
      summary: Solicitar autenticación de segundo factor
      description: >
        Redirects the browser to Keycloak with acr_values=mobo-2fa to
        complete LoA 2 authentication.
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Keycloak for step-up authentication

  /auth/sso-callback:
    get:
      operationId: ssoCallback
      summary: Handle OIDC callback from Keycloak
      description: >
        Exchanges the authorization code for tokens, validates the id_token
        via JWKS, checks resource_access for the "access" role, looks up
        the employee by employee_number (preferred_username), creates a
        local session, and redirects to the frontend.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend (root on success, /login?sso_error= on failure)

  /auth/logout:
    get:
      operationId: logout
      summary: End local session and redirect to SSO logout
      description: >
        Revokes the current session, clears the session_token cookie,
        and redirects the browser to Keycloak's end-session endpoint.
        The browser follows the redirect chain and eventually lands
        at /login?logout=true.
      responses:
        "302":
          description: Redirect to Keycloak end-session endpoint

  /auth/logout-complete:
    get:
      operationId: logoutComplete
      summary: Redirect to frontend login after SSO logout
      description: >
        After Keycloak logout completes and redirects back, this endpoint
        redirects the browser to the frontend login page.
      responses:
        "302":
          description: Redirect to frontend /login

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Extend session expiry
      description: Extends the current session's expiry time by 24 hours.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesión actualizada
                  expires_at:
                    type: string
                    format: date-time
                    example: "2026-06-06T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user information
      description: Returns the authenticated employee's details, role, and profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/admin/revoke-employee/{empId}:
    post:
      operationId: adminRevokeEmployeeSessions
      summary: Revoke all sessions for an employee
      description: >
        Administrative endpoint that revokes both SSO tokens and local
        sessions for a given employee. Requires a valid admin key in the
        X-Admin-Revoke-Key header.
      parameters:
        - name: empId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Admin-Revoke-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesiones revocadas
                  employee_id:
                    type: string
                    format: uuid
                  sessions_count:
                    type: string
                    example: "3"
        "403":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: >
        Session token obtained from SSO callback.
        Send as `Authorization: Bearer <token>`.

  schemas:
    MeResponse:
      type: object
      required: [employee, role, profile]
      properties:
        employee:
          type: object
          properties:
            id:
              type: string
              format: uuid
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
        role:
          type: string
          description: Current user role
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
            trace_id:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
