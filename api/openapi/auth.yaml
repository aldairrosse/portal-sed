openapi: 3.1.0
info:
  title: SED Auth API
  description: Authentication and session management API for the SED evaluation platform.
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1 base path
paths:
  /auth/sso-login:
    get:
      operationId: ssoLogin
      summary: Redirect to Keycloak SSO
      description: >
        Redirects the browser to the Keycloak authorization endpoint.
        Sets an httpOnly sso_state cookie for CSRF protection.
      responses:
        "302":
          description: Redirect to Keycloak login

  /auth/sso-callback:
    get:
      operationId: ssoCallback
      summary: Handle OIDC callback from Keycloak
      description: >
        Exchanges the authorization code for tokens, validates the id_token
        via JWKS, checks resource_access for the "access" role, looks up
        the employee by employee_number (preferred_username), creates a
        local session, and redirects to the frontend.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend (root on success, /login?sso_error= on failure)

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session and return SSO logout URL
      description: Revokes the authenticated session, clears the cookie, and returns the Keycloak end-session URL for the frontend to redirect to.
      responses:
        "200":
          description: Session revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesión revocada
                  sso_logout_url:
                    type: string
                    example: http://auth.sso.mobo.com.mx/realms/mobo/protocol/openid-connect/logout?post_logout_redirect_uri=.../
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Extend session expiry
      description: Extends the current session's expiry time by 24 hours.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: session refreshed
                  expires_at:
                    type: string
                    format: date-time
                    example: "2026-06-06T15:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user information
      description: Returns the authenticated employee's details, role, and profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: >
        Session token obtained from SSO callback.
        Send as `Authorization: Bearer <token>`.

  schemas:
    MeResponse:
      type: object
      required: [employee, role, profile]
      properties:
        employee:
          type: object
          properties:
            id:
              type: string
              format: uuid
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
        role:
          type: string
          description: Current user role
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
            trace_id:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
