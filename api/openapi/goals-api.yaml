openapi: 3.1.0
info:
  title: SED Goals API
  version: '1.0.0'
  description: Core employee-facing API for goals, categories, KPIs, weight validation, and assignments.

servers:
  - url: /api/v1

paths:
  # ============================================================================
  # Categories
  # ============================================================================
  /employees/{empId}/categories:
    get:
      operationId: listCategories
      summary: List categories with nested goals
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '429':
          $ref: '#/components/responses/RateLimit'
    post:
      operationId: createCategory
      summary: Create a goal category
      parameters:
        - $ref: '#/components/parameters/EmpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/InvalidWeightRange'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '409':
          $ref: '#/components/responses/DuplicateCategoryName'
        '429':
          $ref: '#/components/responses/RateLimit'

  /employees/{empId}/categories/{catId}:
    put:
      operationId: updateCategory
      summary: Update a goal category
      parameters:
        - $ref: '#/components/parameters/EmpId'
        - $ref: '#/components/parameters/CatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/InvalidWeightRange'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/DuplicateCategoryName'
    delete:
      operationId: deleteCategory
      summary: Delete a goal category
      parameters:
        - $ref: '#/components/parameters/EmpId'
        - $ref: '#/components/parameters/CatId'
      responses:
        '204':
          description: Category deleted
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/CategoryNotFound'

  # ============================================================================
  # Goals
  # ============================================================================
  /employees/{empId}/categories/{catId}/goals:
    post:
      operationId: createGoal
      summary: Create a goal in a category
      parameters:
        - $ref: '#/components/parameters/EmpId'
        - $ref: '#/components/parameters/CatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Created goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          $ref: '#/components/responses/InvalidGoalRequest'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '422':
          $ref: '#/components/responses/WeightInvalid'
        '429':
          $ref: '#/components/responses/RateLimit'

  /goals/{goalId}:
    put:
      operationId: updateGoal
      summary: Update a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          $ref: '#/components/responses/InvalidGoalRequest'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '409':
          $ref: '#/components/responses/ConcurrentModification'
        '422':
          $ref: '#/components/responses/WeightInvalid'
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '204':
          description: Goal deleted
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  /goals/{goalId}/progress:
    patch:
      operationId: updateGoalProgress
      summary: Update goal progress (currentValue)
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgressRequest'
      responses:
        '200':
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  # ============================================================================
  # Batch
  # ============================================================================
  /goals/batch:
    post:
      operationId: batchGoals
      summary: Atomically create or update multiple goals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGoalRequest'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGoalResponse'
        '400':
          $ref: '#/components/responses/BatchSizeExceeded'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '422':
          $ref: '#/components/responses/WeightInvalid'

  # ============================================================================
  # Weight Validation
  # ============================================================================
  /employees/{empId}/validate-weights:
    post:
      operationId: validateWeights
      summary: Validate Double 100% weight rule
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightValidationResponse'

  # ============================================================================
  # KPIs
  # ============================================================================
  /kpis:
    get:
      operationId: listKPIs
      summary: List KPIs
      description: "Returns the KPIs of the caller's department plus global KPIs (org_node_id null). The department is derived from the authenticated user's org node."
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: KPI list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiListResponse'
    post:
      operationId: createKPI
      summary: Create a KPI
      description: "Creates a KPI. The owning department (org_node_id) is derived from the authenticated creator's org node: the node directly below the organization root, or the top-level node when it does not match the explicit org root. No org_node_id is accepted from the client; null means a global KPI."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKpiRequest'
      responses:
        '201':
          description: Created KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /kpis/{kpiId}:
    put:
      operationId: updateKPI
      summary: Update a KPI
      parameters:
        - $ref: '#/components/parameters/KpiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKpiRequest'
      responses:
        '200':
          description: Updated KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/KpiNotFound'
    delete:
      operationId: deleteKPI
      summary: Delete a KPI
      parameters:
        - $ref: '#/components/parameters/KpiId'
      responses:
        '204':
          description: KPI deleted
        '404':
          $ref: '#/components/responses/KpiNotFound'
        '409':
          $ref: '#/components/responses/KpiLinked'

  /kpis/{kpiId}/value:
    patch:
      operationId: updateKPIValue
      summary: Update a KPI's current value
      description: Updates only the current_value field of a KPI. Used for progress tracking.
      parameters:
        - $ref: '#/components/parameters/KpiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiUpdateValueRequest'
      responses:
        '200':
          description: Updated KPI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/KpiNotFound'

  # ============================================================================
  # KPI Linking
  # ============================================================================
  /goals/{goalId}/kpis:
    post:
      operationId: linkKPI
      summary: Link a KPI to a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkKpiRequest'
      responses:
        '200':
          description: KPI linked to goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          $ref: '#/components/responses/KpiLinkLimitExceeded'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  /goals/{goalId}/kpis/{kpiId}:
    delete:
      operationId: unlinkKPI
      summary: Unlink a KPI from a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/KpiId'
      responses:
        '204':
          description: KPI unlinked
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  # ============================================================================
  # Goal Proposals
  # ============================================================================
  /goals/{goalId}/proposals:
    post:
      operationId: createGoalProposal
      summary: Create a proposal for a goal
      description: Proposes changes to a goal's values (name, weight, target, KPIs) for manager review.
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalProposalRequest'
      responses:
        '201':
          description: Created proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidGoalRequest'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '429':
          $ref: '#/components/responses/RateLimit'
    get:
      operationId: listGoalProposals
      summary: List proposals for a goal
      description: Returns all proposals (pending, accepted, rejected) for audit trail.
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoalProposalResponse'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  /goals/{goalId}/proposals/{propId}:
    patch:
      operationId: updateGoalProposal
      summary: Accept or reject a goal proposal
      description: Manager accepts or rejects a pending proposal. Accepting applies the proposed changes to the goal.
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/PropId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalProposalRequest'
      responses:
        '200':
          description: Updated proposal or goal (on accept)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/PhaseRestricted'
        '404':
          $ref: '#/components/responses/GoalNotFound'

  # ============================================================================
  # Assignments
  # ============================================================================
  /employees/{empId}/assignments:
    get:
      operationId: getAssignment
      summary: Get the employee's current goal assignment
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: Assignment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '404':
          $ref: '#/components/responses/GoalNotFound'
    post:
      operationId: createAssignment
      summary: Create a goal assignment for the employee
      parameters:
        - $ref: '#/components/parameters/EmpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '403':
          $ref: '#/components/responses/PhaseRestricted'

  # ============================================================================
  # Scoring
  # ============================================================================
  /employees/{empId}/score:
    get:
      operationId: getEmployeeScore
      summary: Get the employee's weighted score
      description: Returns the overall weighted score (0-100) based on category weights and goal progress percentages.
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: Weighted score
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                    minimum: 0
                    maximum: 100
                required: [score]
        '404':
          $ref: '#/components/responses/GoalNotFound'

  # ============================================================================
  # Comments (goal / category / assignment)
  # ============================================================================
  /goals/{goalId}/comments:
    get:
      operationId: listGoalComments
      summary: List comments for a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalComment'
    post:
      operationId: createGoalComment
      summary: Create a comment on a goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalComment'

  /goals/{goalId}/comments/{commentId}:
    delete:
      operationId: deleteGoalComment
      summary: Delete a comment
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Comment deleted

  /categories/{catId}/comments:
    get:
      operationId: listCategoryComments
      summary: List comments for a category
      parameters:
        - name: catId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalComment'
    post:
      operationId: createCategoryComment
      summary: Create a comment on a category
      parameters:
        - name: catId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalComment'

  /categories/{catId}/comments/{commentId}:
    delete:
      operationId: deleteCategoryComment
      summary: Delete a comment
      parameters:
        - name: catId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Comment deleted

  /assignments/{assignId}/comments:
    get:
      operationId: listAssignmentComments
      summary: List comments for an assignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalComment'
    post:
      operationId: createAssignmentComment
      summary: Create a comment on an assignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalComment'

  /assignments/{assignId}/comments/{commentId}:
    delete:
      operationId: deleteAssignmentComment
      summary: Delete a comment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Comment deleted

  # ============================================================================
  # Change Requests
  # ============================================================================
  /change-requests:
    get:
      operationId: listChangeRequests
      summary: List change requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: entity_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of change requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequest'
    post:
      operationId: createChangeRequest
      summary: Create a change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequestRequest'
      responses:
        '201':
          description: Change request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'

  /change-requests/{crId}:
    patch:
      operationId: updateChangeRequest
      summary: Approve or reject a change request
      parameters:
        - name: crId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChangeRequestRequest'
      responses:
        '200':
          description: Updated change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'

components:
  parameters:
    EmpId:
      name: empId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatId:
      name: catId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KpiId:
      name: kpiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropId:
      name: propId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100

  schemas:
    # ============================================================================
    # Error Schema
    # ============================================================================
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
            trace_id:
              type: string

    # ============================================================================
    # Category Schemas
    # ============================================================================
    CreateCategoryRequest:
      type: object
      required: [name, weight]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        weight:
          type: number
          minimum: 0.01
          maximum: 100

    UpdateCategoryRequest:
      type: object
      required: [name, weight]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        weight:
          type: number
          minimum: 0.01
          maximum: 100

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        weight:
          type: number
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        next_cursor:
          type: string
          nullable: true

    # ============================================================================
    # Goal Schemas
    # ============================================================================
    CreateGoalRequest:
      type: object
      required: [name, unit, weight, target_value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        unit:
          type: string
          enum: [porcentaje, moneda, numero, binario]
        weight:
          type: number
          minimum: 0.01
          maximum: 100
        target_value:
          type: number
          minimum: 0.01
        direction:
          type: string
          enum: [ascendente, descendente]
          default: ascendente
        baseline_value:
          type: number
          nullable: true
          minimum: 0
          description: Required when direction is descendente; must be > target_value
        kpi_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5

    UpdateGoalRequest:
      type: object
      required: [name, unit, weight, target_value, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        unit:
          type: string
          enum: [porcentaje, moneda, numero, binario]
        weight:
          type: number
          minimum: 0.01
          maximum: 100
        target_value:
          type: number
          minimum: 0.01
        direction:
          type: string
          enum: [ascendente, descendente]
          default: ascendente
        baseline_value:
          type: number
          nullable: true
          minimum: 0
          description: Required when direction is descendente; must be > target_value
        version:
          type: integer
          minimum: 1
        kpi_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5

    GoalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        weight:
          type: number
        target_value:
          type: number
        current_value:
          type: number
        direction:
          type: string
          enum: [ascendente, descendente]
        baseline_value:
          type: number
          nullable: true
        progress_percent:
          type: number
        state:
          type: string
          enum: [borrador, fijada, en_seguimiento, evaluada, cerrada]
        version:
          type: integer
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KpiResponse'
        pending_proposal:
          $ref: '#/components/schemas/GoalProposalResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateProgressRequest:
      type: object
      required: [current_value]
      properties:
        current_value:
          type: number
          minimum: 0

    KpiUpdateValueRequest:
      type: object
      required: [current_value]
      properties:
        current_value:
          type: number
          minimum: 0

    # ============================================================================
    # Goal Proposal Schemas
    # ============================================================================
    CreateGoalProposalRequest:
      type: object
      required: [name, unit, weight, target_value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        unit:
          type: string
          enum: [porcentaje, moneda, numero, binario]
        weight:
          type: number
          minimum: 0.01
          maximum: 100
        target_value:
          type: number
          minimum: 0.01
        direction:
          type: string
          enum: [ascendente, descendente]
          default: ascendente
        baseline_value:
          type: number
          nullable: true
          minimum: 0
          description: Required when direction is descendente; must be > target_value
        kpi_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5

    GoalProposalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        requested_by:
          type: string
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        weight:
          type: number
        target_value:
          type: number
        direction:
          type: string
          enum: [ascendente, descendente]
        baseline_value:
          type: number
          nullable: true
        kpi_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
        reviewed_by:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateGoalProposalRequest:
      type: object
      required: [status, reviewed_by]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        reviewed_by:
          type: string

    # ============================================================================
    # Batch Schemas
    # ============================================================================
    BatchGoalItem:
      type: object
      required: [operation, goal]
      properties:
        operation:
          type: string
          enum: [create, update]
        category_id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        goal:
          $ref: '#/components/schemas/CreateGoalRequest'

    BatchGoalRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/BatchGoalItem'

    BatchGoalResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoalResponse'

    # ============================================================================
    # Weight Validation Schemas
    # ============================================================================
    WeightValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        category_sum:
          type: number
        expected_sum:
          type: number
        deficit:
          type: number
        goal_sums:
          type: array
          items:
            $ref: '#/components/schemas/CategoryGoalSum'

    CategoryGoalSum:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        sum:
          type: number
        expected_sum:
          type: number
        deficit:
          type: number

    # ============================================================================
    # KPI Schemas
    # ============================================================================
    CreateKpiRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        unit:
          type: string
          enum: [porcentaje, moneda, numero, binario]
        description:
          type: string
        direction:
          type: string
          enum: [ascendente, descendente]
          default: ascendente

    UpdateKpiRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        unit:
          type: string
          enum: [porcentaje, moneda, numero, binario]
        description:
          type: string
        direction:
          type: string
          enum: [ascendente, descendente]
          default: ascendente

    KpiResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
        description:
          type: string
        direction:
          type: string
          enum: [ascendente, descendente]
        org_node_id:
          type: string
          format: uuid
          nullable: true
          description: "Org node (department) that owns the KPI; null means a global KPI visible across the organization."
        current_value:
          type: number
          nullable: true
        progress_percent:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KpiListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KpiResponse'
        next_cursor:
          type: string
          nullable: true

    LinkKpiRequest:
      type: object
      required: [kpi_id]
      properties:
        kpi_id:
          type: string
          format: uuid

    # ============================================================================
    # Global Goal Rule Schemas
    # Global goals endpoints are served by the API but not yet documented here;
    # this schema documents the mass-assignment rule object used by those endpoints.
    # ============================================================================
    GlobalRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        rule_type:
          type: string
          enum: [department, min_direct_reports, role]
        department_id:
          type: string
          format: uuid
          nullable: true
        min_direct_reports:
          type: integer
          nullable: true
        profile_id:
          type: string
          format: uuid
          nullable: true
        default_weight:
          type: number
          minimum: 0
          maximum: 100
        default_target:
          type: number
          default: 100
          exclusiveMinimum: 0

    # ============================================================================
    # Assignment Schemas
    # ============================================================================
    AssignmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        cycle_id:
          type: string
          format: uuid
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        global_goals:
          type: array
          items:
            $ref: '#/components/schemas/AssignedGoalResponse'
        shared_goals:
          type: array
          items:
            $ref: '#/components/schemas/AssignedGoalResponse'
        created_at:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required: [cycle_id]
      properties:
        cycle_id:
          type: string
          format: uuid

    AssignedGoalResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        unit: {type: string}
        direction: {type: string}
        goal_kind: {type: string}
        weight: {type: number}
        target_value: {type: number}
        baseline_value: {type: number, nullable: true}
        current_value: {type: number}
        progress_percent: {type: number}
        state: {type: string}
        source: {type: string, enum: [global, shared]}

    GoalComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        assignment_id:
          type: string
          format: uuid
          nullable: true
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    ChangeRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected]
        approved_by:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          nullable: true
        created_at:
          type: string

    CreateChangeRequestRequest:
      type: object
      required: [entity_type, entity_id, requested_by]
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid

    UpdateChangeRequestRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        approved_by:
          type: string
          format: uuid

  # ============================================================================
  # Reusable Responses
  # ============================================================================
  responses:
    PhaseRestricted:
      description: Operation not allowed in current cycle phase
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WeightInvalid:
      description: Weight validation failed (Double 100% rule)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DuplicateCategoryName:
      description: Category name already exists for employee
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConcurrentModification:
      description: Optimistic locking version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KpiLinked:
      description: KPI cannot be deleted because it is linked to goals
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimit:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidWeightRange:
      description: Weight must be between 0 and 100
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CategoryNotFound:
      description: Category not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GoalNotFound:
      description: Goal not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KpiNotFound:
      description: KPI not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidGoalRequest:
      description: Invalid goal request (weight, target, unit, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BatchSizeExceeded:
      description: Batch size exceeds maximum allowed (50)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KpiLinkLimitExceeded:
      description: A goal cannot have more than 5 linked KPIs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
